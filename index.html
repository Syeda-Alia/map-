
<html>
<head>
    <title>World Map</title>
</head>
<body>

    <h1 align="center">World Map</h1>
    <h3 align="center">Click on a Continent</h3>

    <center>
        <img src="image/worldmap.webp"
             usemap="#world"
             width="800"
             alt="World Map">

    
<map name="world">

    <area shape="rect"
          coords="80,100,260,220"
          href="northamerica.html"
          alt="North America">

    <area shape="rect"
          coords="200,225,320,380"
          href="southamerica.html"
          alt="South America">

    <area shape="rect"
          coords="480,80,740,260"
          href="asia.html"
          alt="Asia">

</map>

    </center>
    <footer>
        <hr>
        <center>
            <h3>World Map</h3>
            <p>Explore the Continents of the World</p>
            <p>North America | South America | Asia</p>
            <p>Copyright &copy; 2026 World Map</p>
        </center>
    </footer>


</body>
</html>
